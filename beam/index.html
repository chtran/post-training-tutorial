y but not sufficient. Second, the cap of three traces per task stops easy tasks, which produce many passing rollouts, from dominating the data.\"\n\n\n        )\n        , React.createElement(P, null, \"The open-source tool-use sets get the same treatment. Some of their traces had no reasoning, so reasoning was written in afterwards (backfilled) and then graded to confirm it actually leads to the action that follows. Try the filters on a few rollouts:\"\n\n\n\n        )\n        , React.createElement(FilterDemo, null )\n\n        , React.createElement(H3, null, \"The alignment expert's datasets\"   )\n        , React.createElement(P, null, \"The alignment expert has to converse, follow instructions and handle long documents, which the agentic data does not cover. Each of its extra datasets is built differently. The table gives the construction and what is thrown away; the two sets with the most unusual recipes, knowledge calibration and safety, get their own sections after it.\"\n\n\n\n        )\n        , React.createElement(Table, { wrapText: true, rowLines: true,}\n          , React.createElement(TableHeader, null, React.createElement(TableRow, null, React.createElement(TableHead, { className: \"w-[150px]\",}, \"Dataset\"), React.createElement(TableHead, null, \"How the traces are made, and what is removed\"        )))\n          , React.createElement(TableBody, null\n            , builds.map((r) => (\n              React.createElement(TableRow, { key: r.b,}\n                , React.createElement(TableCell, { className: \"font-medium\",}, r.b)\n                , React.createElement(TableCell, null, React.createElement('div', null, r.how), React.createElement('div', { className: \"pt-1 text-secondary\" ,}, React.createElement('span', { className: \"font-medium text-primary\" ,}, \"Removed: \" ), r.drop))\n              )\n            ))\n          )\n        )\n        , React.createElement(P, null, \"One removal in the chat row deserves a second look. Some prompt ain without it\"       )\n        , React.createElement(P, null, \"Safety demonstrations have to show the model refusing harmful requests, declining\"\n\n          , \" \", React.createElement(Term, { def: \"A prompt written to trick a model into complying with a request it should refuse, for example by wrapping it in role-play.\"                     ,}, \"jailbreaks\"), \", and still helping with requests that only look harmful. The simple way to get such traces is to put the safety policy in the system prompt and let a model follow it. But a model trained on those traces learns to look up a policy that will not be there in deployment. The report follows a method called Deliberative Alignment to avoid this.\"\n\n\n\n        )\n        , React.createElement(Steps, { items: [\n          { title: \"Generate with the policy visible\", body: \"A model receives the safety policy in its system prompt together with a request, and samples several candidate traces, each a reasoning passage plus an answer.\" },\n          { title: \"Judge\", body: \"A judge model discards candidates that comply with a harmful request or refuse a benign one.\" },\n          { title: \"Rewrite the reasoning\", body: \"A separate model rewrites the surviving traces so the reasoning reads as general deliberation over safety principles, not as a recitation of a document it was handed.\" },\n          { title: \"Train with the policy removed\", body: \"The policy is deleted from the system prompt. The model sees a request and reasoning that reaches the right decision unaided, so it has to carry the principles in its weights.\" },\n        ],} )\n        , React.createElement(P, null, \"The same recipe is used for multi-turn conversations, with one change: only the last turn is rewritten and trained on. Earlier turns are context. That makes it possible to include conversations in which an earlier assistant turn already contains violating content, as happens in a \"\n\n\n\n           , React.createEl with tokens on average five policy versions behind the trainer, and a gradient norm that stayed in a narrow band for the whole run.\",\n    \"The reward is binary correctness minus a linear length cost. A judge zeroes the correctness of verifier-passing rollouts that it flags as reward hacks, and a rollout that exhausts its reasoning-effort budget gets no correctness reward.\",\n    \"The policy did not simply sharpen: final-answer tokens became much more predictable (NLL 0.25 to 0.06 nats) while reasoning tokens became slightly less so (0.63 to 0.69). Skills held through single-domain phases, and BrowseComp rose from 50.1 to 57.9 before any search task was trained.\",\n  ],\n};\n\n// ---------------------------------------------------------------------\n// Demo 1: waiting for the batch versus asynchronous generation (toy).\n// ---------------------------------------------------------------------\nconst SLOTS = 6;\nconst HORIZON = 120;\nconst STEP_EVERY = 4;\nconst toyDuration = (slot, k) => (slot === 2 && k === 0 ? 78 : 8 + ((slot * 7 + k * 5 + slot * k * 3) % 8));\n\nfunction simulateSchedule(mode) {\n  const rollouts = [];\n  const steps = [];\n  if (mode === \"sync\") {\n    let t = 0, k = 0;\n    while (t < HORIZON) {\n      let longest = 0;\n      for (let s = 0; s < SLOTS; s++) {\n        const d = toyDuration(s, k);\n        rollouts.push({ slot: s, start: t, end: t + d });\n        longest = Math.max(longest, d);\n      }\n      t += longest; k += 1;\n      if (t <= HORIZON) steps.push(t);\n    }\n  } else {\n    const ends = [];\n    for (let s = 0; s < SLOTS; s++) {\n      let t = 0, k = 0;\n      while (t < HORIZON) {\n        const d = toyDuration(s, k);\n        rollouts.push({ slot: s, start: t, end: t + d });\n        if (t + d <= HORIZON) ends.push(t + d);\n        t += d; k += 1;\n      }\n    }\n    ends.sort((a, b) => a - b);\n    for (let i = STEP_EVERY - 1; i < ends.length; i += STEP_EVERY) steps.push(ends[i]);\n  }\n  let busy = 0, maxSpan = 1;\n  const segments = [];\n  const bars = [];\n  rollouts.forEach((r) => {\n    const end = Math.min(r.end, HORIZON);\n    busy += end - r.start;\n    const cuts = [r.start, ...steps.filter((x) => x > r.start && x < end), end];\n    maxSpan = Math.max(maxSpan, cuts.length - 1);\n    for (let i = 0; i < cuts.length - 1; i++) {\n      const version = steps.filter((x) => x <= cuts[i]).length;\n      segments.push({ from: cuts[i] - r.start, to: cuts[i + 1] - r.start, version });\n    }\n    bars.push({ slot: r.slot, start: r.start, end, segments: segments.splice(0) });\n  });\n  return { bars, steps, utilisation: busy / (SLOTS * HORIZON), maxSpan };\n}\n\nfunction ReadOut({ label, value, note }) {\n  return (\n    React.createElement('div', { className: \"flex min-w-0 flex-col rounded-lg bg-wash px-3 py-2\"      ,}\n      , React.createElement('span', { className: \"text-[11.5px] leading-4 text-secondary\"  ,}, label)\n      , React.createElement('span', { className: \"font-mono text-[17px] leading-7 text-primary\"   ,}, value)\n      , note ? React.createElement('span', { className: \"text-[11.5px] leading-4 text-secondary\"  ,}, note) : null\n    )\n  );\n}\n\nfunction AsyncDemo() {\n  const [mode, setMode] = useState(\"async\");\n  const sim = useMemo(() => simulateSchedule(mode), [mode]);\n  const left = (t) => (t / HORIZON) * 100 + \"%\";\n  return (\n    React.createElement(Demo, { title: \"Six inference slots, two hours, one slow rollout\"       ,\n      takeaway: mode === \"sync\"\n        ? \"Waiting for the batch: every slot sits idle until the slowest rollout of its batch finishes, and the optimizer gets very few steps. Each rollout is written by exactly one policy version, which is the only thing this schedule has going for it.\"\n        : \"Asynchronous: no slot ever waits and the optimizer steps many times, but the weights change under rollouts that are still running. Follow the long bar in slot 3: its colour changes at every optimizer step, so its tokens ll, React.createElement(TableCell, null, \"79% of the run\"   ), React.createElement(TableCell, { className: \"text-right font-mono\" ,}, \"35%\"), React.createElement(TableCell, null, \"Taken before the harder software-engineering task set was introduced at 83%.\"          ))\n            , React.createElement(TableRow, null, React.createElement(TableCell, null, \"100% of the run\"   ), React.createElement(TableCell, { className: \"text-right font-mono\" ,}, \"41%\"), React.createElement(TableCell, null, \"Still improving as effort increases all the way to \"         , React.createElement(V, null, \"e\"), \" = 512.\"  ))\n          )\n        )\n        , React.createElement(P, null, \"The report draws two conclusions. RL moved the whole trade-off: higher scores at the same output length, and the same score for fewer tokens. It also widened the range of effort settings over which extra computation still buys accuracy, so a larger budget is not wasted on the final model.\"\n\n\n\n        )\n        , React.createElement(P, null, \"The evaluation chapter adds the order in which these happened: the model first learned to solve the same tasks with fewer tokens, and later, as its agentic ability grew, the extra tokens at high effort began to turn into higher scores. It names this token efficiency as Beam's main advantage at inference time and attributes it to the length cost used in this run. The report does not define the unit of \"\n\n\n\n                    , React.createElement(V, null, \"e\"), \" in these sections.\"\n        )\n\n        , React.createElement(H3, null, \"Generalization: held-out benchmarks across the phases of the run\"        )\n        , React.createElement(P, null, \"Checkpoints were evaluated throughout the run on eight benchmarks whose tasks were excluded from the RL data: SWE-bench Verified, SWE-bench Pro, DeepSWE, BrowseComp, HLE (text, no tools), LiveCodeBench v6, AIME 2026 and GPQA-Diamond. The settings never changed: temperature 1, top-p 0.99, \"\n\n\n                 , React.createElement(V, null, \"e\"), \" = 512 and a 256K output-token limit. Scores rose steadily.\"\n        )\n        , React.createElement(P, null, \"What makes the curves informative is that the training mixture was restricted to a single domain for long stretches. The timeline puts those stretches next to the measurements that the next two findings rely on.\"\n\n\n        )\n        , React.createElement(RunTimeline, null )\n        , React.createElement(Surprise, { title: \"Two long single-domain phases caused no forgetting\"      ,}, \"For a quarter of the run (26% to 52%) the model trained only on mathematics, STEM and competitive programming, and then for another eighth (52% to 65%) only on software engineering. Training on one domain for that long would normally be expected to erode the others. The report finds that software-engineering benchmarks held their level through the first phase and that STEM and coding benchmarks did not regress during the second.\"\n\n\n\n\n        )\n        , React.createElement(Surprise, { title: \"Search improved before any search task was trained\"       ,}, \"No search or browsing task was in the training data before the 83% mark. BrowseComp, a browsing benchmark, still rose from 50.1 at 27% of the run to 57.9 at 83%. The gain of 7.8 points therefore came from training on other domains. Measurements start at 27% because the search backend changed then.\"\n\n\n\n        )\n        , React.createElement(P, null, \"The policy that comes out of this run is the agentic teacher. How it is combined with the alignment expert into the released model is the subject of \"\n\n                , React.createElement(LessonLink, { to: \"mopd\",} ), \".\"\n        )\n        , React.createElement(Src, null, \"section 4.1.2 with figures 15 to 17, and the token-efficiency paragraph of section 5.1 with figure 40\"                )\n      )\n    )\n  );\n}\n\nreturn { meta, Lesson };\n})();\n\nconst L_tasks = (() => {\nconst meta = {\n  id: \"tasks\",\n  nav: \"Tasks and rewards\",\n  title: \"RL tasks and reward integrity\",\n  question: \"What makes a task safe to train on, and how are hackable or noisy rewards kept out of a pool of nearly one million tasks?\",\n  minutes: 22,\n  takeaways: [\n    \"RL reinforces whatever the verifier pays for, so the team fixed quality (zero reward noise, no hacks) and difficulty first, and only then scaled: several million candidate tasks were filtered down to nearly one million.\",\n    \"Difficulty is measured against the model being trained. A task is useful only while a group of attempts contains both successes and failures, and it must not look easy or hard for the wrong reason, such as a leaked answer or a website the sandbox cannot reach.\",\n    \"The domains repeat the same checks in their own form: the reference solution must score 1 and doing nothing must score 0, a judge must give the same answer every time, and an attacker that is told how to cheat must fail.\",\n    \"Passing those checks before training is not enough. Judges re-read passing rollouts during training and zero out hacks, and tasks where a new hack appears are removed or repaired, so the pool keeps shrinking.\",\n    \"Two filters matter more than they look. Guessable questions teach the model to guess inside its reasoning, and a weak model outscoring a strong one usually points to a wrong answer key, so both kinds of question are removed.\",\n  ],\n};\n\n// ---------- data ----------\nconst outcomes = [\n  { did: \"Solved the task\", r1: { t: \"Earned reward\", d: \"The signal RL is supposed to amplify.\", c: \"bg-tint-green\", k: \"text-green\" }, r0: { t: \"False negative: noise\", d: \"Correct work is graded wrong, for example 3.51 m/s against a gold answer of 3.5 m/s. Sound reasoning is punished at random.\", c: \"bg-tint-orange\", k: \"text-orange\" } },\n  { did: \"Did not solve it\", r1: { t: \"False positive: a hack\", d: \"The verifier is fooled, for example by editing the test data. The model learns to fool it again.\", c: \"bg-tint-red\", k: \"text-red\" }, r0: { t: \"Earned zero\", d: \"A real failure. Useful as long as other attempts at the same task succeed.\", c: \"bg-wash\", k: \"text-secondary\" } },\n];\n\nconst overview = [\n  { d: \"Software engineering\", job: \"Change a real repository so that a requested behaviour works\", by: \"Hidden tests, run on the submitted patch in a separate environment\" },\n  { d: \"Terminal use\", job: \"Finish a job with shell commands inside a container\", by: \"A custom shell or Python script that inspects the final state\" },\n  { d: \"Math and science\", job: \"Answer a hard question with one short final answer\", by: \"SymPy comparison for math, a judge model for science\" },\n  { d: \"Competitive coding\", job: \"Write a program that reads stdin and writes stdout\", by: \"Every test case must pass within the time limit\" },\n  { d: \"Web search\", job: \"Answer a multi-hop question using a search tool and a browse tool\", by: \"Exact match, then a length limit, then a judge model\" },\n  { d: \"Knowledge work\", job: \"Produce the reports, spreadsheets and slides of a profession\", by: \"A tool-using judge that scores a weighted rubric\" },\n  { d: \"General tool use\", job: \"Complete a workflow by calling tools, often while talking to a user\", by: \"Rules, a rubric or a hash of the final environment state\" },\n];\n\nconst domainDetail = {\n  swe: {\n    label: \"Software engineering\",\n    task: \"A container image holding a problem statement, a runnable snapshot of the repository before the change, a reference implementation and a verifier. Tasks come from the team's own mining pipeline, from vendors and from seven open corpora, plus synthetic feature-removal tasks.\",\n    reward: \"The submitted patch is extracted and applied in a separate verifier environment, where hidden tests run. The tests must have failed before the reference change (fail-to-pass) and must pass after it without breaking tests that already passed (pass-to-pass).\",\n    before: [\n      \"Judges read the statement, tests, reference fix and verifier command against separate criteria; repairable statements are rewritten, the rest are dropped.\",\n      \"A stricter second review, with the reference fix withheld, asks three things: can every tested requirement be read off what the solver sees, do the tests enforce the request, can a trivial patch pass. Each gets three independent model calls and any valid negative rejects the task.\",\n      \"An ambiguity judge and a verifier-strength judge (both agents) try to prove the task unfair or the tests weak, as described above under 'Testing a verifier in both directions'.\",\n      \"The pool is balanced across languages and repositories, repeated variants of one change are limited, tasks a reference model solves reliably are removed, and anything matching a held-out evaluation is excluded.\",\n    ],\n    during: [\n      \"Repository images are cleaned of post-change commit history and artifacts that would expose the reference solution.\",\n      \"A judge reads the code of every passing submission next to the verifier; a successful hack gets zero reward.\",\n      \"Groups of rollouts are scanned for submission failures, different grades on identical or near-identical patches, and suspicious passes. Task-health and reward-integrity judges then decide whether the task or the model is at fault.\",\n    ],\n    note: \"The report's atlas of 13,500 sampled tasks (12,000 mined, 1,500 synthesized) spans Python, TypeScript, Java, Go, JavaScript, Rust, C/C++, C#, Ruby and PHP. The report warns that these sample proportions are not the training mixture.\",\n  },\n  term: {\n    label: \"Terminal use\",\n    task: \"A task in Harbor format: instructions, a container built from a Dockerfile, an oracle script holding the reference solution, and a verifier. Tasks come from vendors and from the synthetic pipeline; open-source terminal tasks were examined and rejected.\",\n    reward: \"The verifier is a custom shell or Python script that inspects files, validates computed values or measures runtime. It has to match the instructions, cover every stated requirement and resist tampering.\",\n    before: [\n      \"Six rule-based checks: Harbor compatibility, a well-layered Dockerfile, images that build, the oracle scoring 1.0 on five of five attempts, a no-op script scoring 0.0 on five of five attempts, and no privileged information leaking into the agent's sandbox.\",\n      \"More than 15 checks by an agentic judge, for example that everything the instructions require is tested and nothing else is. Human annotators audit the judge, and the check definitions grow as new flaws are found.\",\n      \"Live rollouts: a task that a strong model cannot solve in k attempts is discarded (the report does not give k). Successful rollouts are read by a judge for hacks and for environment problems such as missing tools.\",\n      \"An adversarial agent, handed a full taxonomy of reward hacks, tries to score 1.0 with a wrong or incomplete solution. Every task it breaks is removed.\",\n    ],\n    during: [\n      \"Synthetic tasks were filtered again after their behaviour in RL was observed.\",\n      \"Humans and automated reviewers read real rollouts for verifier weaknesses, and the affected tasks are fixed or dropped.\",\n    ],\n    note: \"Each task is tagged against three taxonomies: subject matter (20 categories, 182 domains), task properties (14 properties, 244 subproperties) and instruction style (7 styles, 34 substyles), up to 460 tags per task. Tags and embedding similarity are used to remove templated near-duplicates.\",\n  },\n  math: {\n    label: \"Math and science\",\n    task: \"A question and a gold answer. More than one million were sourced from open corpora, vendors and synthetic pipelines, and many were then filtered out.\",\n    reward: \"The model writes its final answer inside \\\\boxed{}. Math answers must be numeric or symbolic and are compared with SymPy. Science answers are compared with the gold answer by a judge model that also sees the question. An answer longer than 200 characters gets nothing (3 times the gold length for the few tasks with long gold answers).\",\n    before: [\n      \"Strong-versus-weak gap: drop questions where a strong model does worse than a weak one.\",\n      \"Guessability: drop yes/no and multiple-choice questions, questions with only a few possible answers, very common answers such as 0, 1 or π, and anything answerable by reciting a definition.\",\n      \"Broken questions: missing figures or context, contradictions, more than one reading.\",\n      \"Broken answers: a model reviews the gold answer, re-derives it with tools, and several independent solvers must agree with it.\",\n      \"Format and grading limits: no multi-part answers, no proofs, English only, gold answers SymPy can parse, and a judge that grades the same answer the same way.\",\n      \"Easy filter: drop what the initial checkpoint often solves with a low thinking budget.\",\n    ],\n    during: [\"Section 4.1.7 describes no check specific to training time. The general rule applies: rollouts are analysed after every round and faulty tasks are removed.\"],\n    note: \"Science questions were rewritten to state the required precision, units and constants, so that correct reasoning always lands on the gold answer.\",\n  },\n  code: {\n    label: \"Competitive coding\",\n    task: \"A problem statement, a test suite of input files with expected outputs, and a comparison script. Problems come from open corpora and from licensed coding platforms.\",\n    reward: \"The final program is run in an isolated grading sandbox with time limits. Reward is 1 only if every test passes. A compile error, a crash, one wrong output or one timeout gives 0.\",\n    before: [\n      \"A minimum number of test cases per problem.\",\n      \"The comparison script must agree with the prompt on case, whitespace and numeric precision.\",\n      \"The reference solution must pass in the team's own environment.\",\n      \"No broken prompts, such as ones that rely on an image or promise partial scoring.\",\n      \"Deduplication by MinHash on the statement, plus agents that look up the canonical problem ID where one exists.\",\n    ],\n    during: [\"Section 4.1.8 describes no check specific to training time.\"],\n    note: \"The language is picked at random when the task is served. Every task can be solved in C++; 70% can also be solved in Python, because a task is excluded from Python when a Python reference solution runs too slowly for limits tuned to C++. Some episodes also give the model a bash tool to test its code.\",\n  },\n  search: {\n    label: \"Web search\",\n    task: \"A question, a gold answer and two tools backed by a third-party search provider. Search returns URLs with titles and snippets of about 200 characters. Browse returns a page as Markdown capped at 8K tokens and accepts ripgrep arguments to search inside the full page.\",\n    reward: \"A regular expression pulls out the text after \\\"The answer is:\\\". That excerpt goes through three stages: exact match, a length limit, and a judge model. The demo below walks through them.\",\n    before: [\n      \"Leakage: drop questions whose text reveals the answer.\",\n      \"Memorization: drop questions a model answers with no search tools.\",\n      \"Solvability: drop questions that need pages missing from the provider's index or blocked by a CAPTCHA.\",\n      \"Wrong gold answers: drop questions where a model judges the gold answer invalid, prefers a common alternative answer, or finds the question contradictory or underspecified.\",\n      \"Unreliable grading: drop any question on which the judge was inconsistent or subjective.\",\n      \"Difficulty: keep a task only if a strong model's solve rate beats a weak model's by at least 12.5 percentage points, or the weak model's solve rate is zero.\",\n    ],\n    during: [\"The URLs the model visits are examined. A static blocklist covers known answer dumps (datasets, papers, blogs), and a dynamic blocklist fuzzy-matches pages that contain both the question and the answer.\"],\n    note: \"Topics include history, art, finance, sports, science and technology, media and law. Non-English questions were excluded.\",\n  },\n  kw: {\n    label: \"Knowledge work\",\n    task: \"A Harbor task directory shipped as a digest-pinned container image: instructions, source documents and the applications needed to do the job. Deliverables include .docx, .xlsx, .md, .csv, .pdf and .pptx files, often several per task.\",\n    reward: \"The agent works in an untrusted sandbox. A tool-using judge in a separate trusted sandbox opens the files, checks calculations and sources, and scores each rubric criterion independently, including penalty criteria. The scores are aggregated and compared with a threshold: at or above it the reward is 1, otherwise 0. The report does not state the threshold.\",\n    before: [\n      \"Rubric checks for coverage, atomicity, observability, non-duplication and sensible weights.\",\n      \"White-box attackers see the rubric and grading specification and look for credit without real work. Black-box attackers see only what the solver sees and look for ambiguity, missing information and shortcuts.\",\n      \"A rubric judge and a goal judge grade the same frozen deliverables. The first asks whether the criteria are met, the second whether the professional objective was achieved. Disagreement flags the task.\",\n      \"Solvability rollouts, then short RL derisking runs under the training reward setup. Failures feed back into the rubric and the grader.\",\n    ],\n    during: [\n      \"An online integrity judge audits both the deliverable and the trajectory. Unsupported provenance, surface-level criterion gaming or attempts to manipulate the ng repository, picks a substantial feature and deletes its implementation and tests. Restoring the feature is the task, graded by hidden integration tests written to accept alternative implementations.\",\n    guard: \"The remaining tests must still pass after the removal. The verifier must fail without the feature and pass with the reference restored. Images are scanned for surviving copies of the removed code, adversarial agents try to recover them, and three validation trials must agree.\" },\n  { n: \"Three-stage task builder\", dom: \"Terminal use\",\n    how: \"A judge keeps web pages that could seed a terminal task (seeds can also be sampled from the taxonomies). A model turns each seed into a task description, steered by specificity and style knobs. A coding agent in a sandbox then builds the full Harbor task.\",\n    guard: \"A quality gate of judge checks and static checks returns feedback to the agent. After 10 failed rounds the task is abandoned.\" },\n  { n: \"Same recipe, professional seeds\", dom: \"Knowledge work\",\n    how: \"A real professional document is paired with a sampled occupation. An authoring agent builds everything in one episode: a manager-voice instruction, two to five reference documents, golden deliverables, the weighted rubric and the image.\",\n    guard: \"Eight deterministic validators and nine judged criteria, with up to ten revision rounds. Then an independent vote by a different model family (covered in part 3).\" },\n  { n: \"Science Q&A\", dom: \"Math and science\",\n    how: \"Forum posts lack a reference answer and often ask for an explanation. A model rewrites each into self-contained questions with a short checkable answer, and extracts that answer from the replies.\",\n    guard: \"A model rewrites the question until the reference is the only correct answer, or flags it unrepairable. The question is then solved several times, graded by the training judge, and diagnosed: wrong reference, ambiguous question, judge noise  # forecast prevalence`;\n\nconst rlaifCode = `# Illustrative sketch of the helpfulness reward. The report describes each\n# piece in prose; it prints no code, does not give the five level values\n# (even spacing is assumed here) and does not say in which order the\n# penalties are applied.\nLEVEL = {\"strongly disfavored\": 0.0, \"disfavored\": 0.25, \"tie\": 0.5,\n         \"favored\": 0.75, \"strongly favored\": 1.0}\n\ndef helpfulness_reward(task, rollout):\n    verdict = reward_model.compare(\n        prompt=task.first_user_turn,\n        policy_answer=rollout.final_answer,\n        anchor_answer=task.anchor,          # fixed per prompt\n        policy_shown_first=task.order,      # fixed per prompt\n        rubric=NINE_ATTRIBUTES)\n    r = LEVEL[verdict]\n    r *= unnecessary_content_factor(rollout)   # e.g. needless follow-up questions\n    r *= withheld_content_factor(rollout)      # e.g. clarifying instead of answering\n    r -= lam * len(rollout.final_answer)       # the reward model likes long answers\n    r -= reasoning_effort_cost(rollout)\n    return r`;\n\nfunction Lesson() {\n  return (\n    React.createElement('div', { className: \"flex flex-col gap-2\"  ,}\n      , React.createElement(Stage, { step: 1, title: \"Training values that have no unit test\"      ,}\n        , React.createElement(Lead, null, \"Beam is distilled from two teachers. The agentic teacher (\"\n                   , React.createElement(LessonLink, { to: \"rl\",} ), \" and \"  , React.createElement(LessonLink, { to: \"tasks\",} ), \") learns to solve tasks. This lesson is about the second one, the alignment teacher, whose job is to make the final model safe, accurate, good at following instructions and helpful.\"\n\n\n        )\n        , React.createElement(P, null, \"The alignment teacher starts from the same midtrained checkpoint as the agentic teacher and follows a similar recipe: supervised fine-tuning (SFT) on demonstrations, then reinforcement learning (RL), in which the model attempts tasks and is pushed toward its better-scoring attempts. A single attempt is called a \"\n\n\n                     , React.createElement(Term, { def: \"One complete attempt at a task by the current model: its reasoning, any tool calls, and its final answer.\"                  ,}, \"rollout\"), \", and the model being trained is called the \"\n                  , React.createElement(Term, { def: \"The model viewed as something that chooses outputs. 'The policy' and 'the model being trained' mean the same thing here.\"                   ,}, \"policy\"), \". The report names three ways in which this teacher differs from its sibling.\"\n\n        )\n        , React.createElement(Findings, { items: [\n          React.createElement('span', null, React.createElement('b', null, \"Broader tasks.\" ), \" Values show up in writing and editing, fact-finding, document understanding, open-ended conversation and multi-turn collaboration, not only in coding, STEM and terminal use.\"                       ),\n          React.createElement('span', null, React.createElement('b', null, \"No test suite.\"  ), \" Whether a reply was helpful or safe cannot be decided by running code. Rewards therefore come from three kinds of signal, shown in the second table below.\"                           ),\n          React.createElement('span', null, React.createElement('b', null, \"Goals that pull against each other.\"     ), \" Safety can conflict with following instructions, and helpfulness can come at the expense of accuracy. The team chose a small, carefully built data mixture and shorter runs, with people evaluating the result regularly, so that they could adjust subjective criteria, tune tradeoffs and catch reward hacks.\"                                              ),\n        ],} )\n\n        , React.createElement(H3, null, \"What the model should do, in priority order\"       )\n        , React.createElement(P, null, \"Because the goals conflict, the report ranks them. The ranking has three tiers, and a higher tier wins when two principles disagree.\"\n\n\n        )\n        , React.createElement(Panel, { caption: \"The principle hierarchy from section 4.2.1. Accuracy covers factuality, faithfulness to the provided context, and calibrated confidence about both. Instruction following covers system and developer instructions, transparent pursuit of the user's objective, and reasonable resolution of uncertainty. Helpfulness covers how comprehensive, efficient, proactive and consistent responses are.\"                                              ,}\n          , React.createElement(TierLadder, null )\n        )\n\n        , React.createElement(H3, null, \"Three kinds of reward signal\"    )\n        , React.createElement(P, null, \"Each principle is trained in one or more RL environments, and each environment needs something that turns a response into a number. The report names three kinds of signal, listed here from the most mechanical to the most subjective. The reward model is used for conversational quality, where the report treats human judgment as the only ground truth.\"\n\n\n\n\n        )\n        , React.createElement(Table, { wrapText: true, rowLines: true,}\n          , React.createElement(TableHeader, null, React.createElement(TableRow, null, React.createElement(TableHead, null, \"Signal\"), React.createElement(TableHead, null, \"How it scores a response\"    ), React.createElement(TableHead, null, \"Used for\" )))\n          , React.createElement(TableBody, null\n            , signals.map((r) => React.createElement(TableRow, { key: r.s,}, React.createElement(TableCell, { className: \"font-medium\",}, r.s), React.createElement(TableCell, null, r.what), React.createElement(TableCell, null, r.where)))\n          )\n        )\n        , React.createElement(P, null, \"A \"\n           , React.createElement(Term, { def: \"A language model used as a grader. It reads a response together with a rubric, a gold answer or other context, and outputs a verdict that is turned into a reward.\"                              ,}, \"judge\"), \" can be fooled in ways a compiler cannot, so most of the design work in this lesson is about closing the cheapest route to a high score that does not involve doing the right thing.\"\n\n\n        )\n\n        , React.createElement(H3, null, \"Seed with SFT, then shape with RL\"      )\n        , React.createElement(P, null, \"RL works by comparing rollouts and making the better ones more likely. It cannot reward a behavior that never occurs. The clearest example is declining to answer: the starting policy rarely said \\\"I don't know\\\", so there was nothing for RL to reinforce.\"\n\n\n\n        )\n        , React.createElement(P, null, \"The fix is the same for every principle. A small amount of targeted SFT data makes the behavior appear in some rollouts, and RL then decides how often it should appear. How the seed sets are built is covered in \"\n\n                            , React.createElement(LessonLink, { to: \"sft\",} ), \", not here.\"\n        )\n\n        , React.createElement(H3, null, \"Forecasting what RL will do before running it\"       )\n        , React.createElement(P, null, \"Seeding raises a practical question: given a checkpoint and a reward, which behaviors will RL amplify and which will it remove? The report answers it with an idea borrowed from population genetics. Think of the rollouts as a population and a behavior, for example wrapping every answer in headings, as a trait some of them carry.\"\n\n\n\n        )\n        , React.createElement(P, null, \"A trait spreads when two things hold: enough individuals already carry it, and carriers do better than non-carriers. For a behavior these become its prevalence at the SFT checkpoint and its selective advantage, meaning how much more reward rollouts with the behavior earn than the other rollouts for the same task. Both can be measured before RL starts.\"\n\n\n\n        )\n        , React.createElement(KeyIdea, null, \"SFT decides which behaviors exist and how common they are. The reward decides which of them grow. A behavior the reward cannot see stays exactly as common as SFT left it, which is why the team removed unwanted habits with filters and with changes to the reward.\"\n\n\n\n        )\n      )\n\n      , React.createElement(Stage, { step: 2, title: \"The forecast, then one reward per principle\"      ,}\n        , React.createElement(P, null, \"This part has two halves. The first turns the population picture into two equations. The second goes through the RL environments one principle at a time and explains the shape of each reward.\"\n\n\n        )\n\n        , React.createElement(H3, null, \"The forecast: prevalence times selective advantage\"     )\n        , React.createElement(P, null, \"The alignment teacher is trained with GRPO, the method described in \"\n                     , React.createElement(LessonLink, { to: \"rl\",} ), \": for each task the policy produces a group of rollouts, each rollout gets a reward, and its \"\n                      , React.createElement(Term, { def: \"A rollout's reward minus the mean reward of its group, divided by the group's standard deviation. Positive means better than the group's average.\"                      ,}, \"advantage\"), \" is how far its reward sits above the group mean, in units of the group's standard deviation. Each rollout pulls the policy toward itself in proportion to its advantage.\"\n\n\n        )\n        , React.createElement(P, null, \"The first equation says how much weight a behavior gains in one batch. Read it as \\\"how many rollouts pull\\\" times \\\"how hard each pulls\\\".\"\n\n\n        )\n        , React.createElement(Eq, { label: \"Gain per batch\"  , note: \"From the report.\"  ,}, \"Δθ = κη · π · \"\n                , React.createElement(V, null, \"Ā\")\n        )\n        , React.createElement(Where, { items: [\n          [\"Δθ\", \"the change, per batch, in the behavior's log-weight: how strongly the policy favors it\"],\n          [\"π\", \"prevalence: the fraction of rollouts that show the behavior\"],\n          [React.createElement('span', null, \"Ā\"), \"the mean advantage of those rollouts\"],\n          [\"κη\", \"one constant for the whole training recipe that sets the speed. It is fitted once on one completed run and reused for every other run\"],\n        ],} )\n        , React.createElement(P, null, \"The second equation follows the behavior over time. It is written for the log-odds of the behavior, a quantity that runs from very negative when the behavior almost never occurs to very positive when it almost always does.\"\n\n\n        )\n        , React.createElement(Eq, { label: \"Behavior equation\" , note: \"From the report, which calls it a replicator-type equation after the replicator equation of evolutionary dynamics.\"               ,}, \"d\"\n          , React.createElement(V, null, \"L\"), \" / d\"  , React.createElement(V, null, \"t\"), \" ≈ 2 κη · \"     , React.createElement(V, null, \"g\"), \" · π (1 − π),    where \"        , React.createElement(V, null, \"L\"), \" = log( π / (1 − π) )\"\n        )\n        , React.createElement(Where, { items: [\n          [\"L\", \"the log-odds of the behavior; it rises when the behavior becomes more common\"],\n          [\"t\", \"training time, in batches\"],\n          [\"g\", \"selective advantage: how many within-group reward standard deviations the behavior's rewards sit above the alternatives\"],\n          [\"π (1 − π)\", \"largest at π = 50% and zero at 0% and 100%: selection needs both variants present to have something to compare\"],\n        ],} )\n        , React.createElement(P, null, \"The sign of \"\n             , React.createElement(V, null, \"g\"), \" gives the direction. Behaviors with \"      , React.createElement(V, null, \"g\"), \" > 0 are amplified, those with \"       , React.createElement(V, null, \"g\"), \" < 0 are squashed, and those with \"\n              , React.createElement(V, null, \"g\"), \" ≈ 0 stay frozen at their SFT prevalence. The starting prevalence π\"            , React.createElement('sub', null, \"0\"), \" and \"  , React.createElement(V, null, \"g\"), \" are measured at step 0 from a few dozen scored groups, so a forecast costs a small evaluation, not a training run.\"\n\n        )\n        , React.createElement(ForecastDemo, null )\n        , React.createElement(P, null, \"Applied to the reward itself, the same update predicts how fast an environment's score climbs.\"\n\n        )\n        , React.createElement(Eq, { label: \"Reward equation\" , note: \"From the report.\"  ,}, \"d\"\n          , React.createElement(V, null, \"R\"), \" / d\"  , React.createElement(V, null, \"t\"), \" = κη · σ\"    , React.createElement('sub', null, React.createElement(V, null, \"R\"))\n        )\n        , React.createElement(Where, { items: [\n          [\"R\", \"the mean reward of one environment\"],\n          [React.createElement('span', null, \"σ\", React.createElement('sub', null, \"R\")), \"the standard deviation of reward within a group of rollouts for the same task\"],\n        ],} )\n        , React.createElement(P, null, \"Reward rises in proportion to the spread that is left. When every rollout in a group scores the same there is nothing to select between and progress stops. The report says the reward therefore saturates at the \"\n\n\n           , React.createElement(Term, { def: \"As commonly defined (the report does not define it): the share of tasks on which at least one of k sampled rollouts succeeds. It is the best a policy could do by learning to always produce its own best attempt.\"                                       ,}, \"pass@k ceiling\" ), \".\"\n        )\n        , React.createElement(P, null, \"In code the whole procedure is a measurement followed by a short loop.\"\n\n        )\n        , React.createElement(CodeBlock, { code: forecastCode,} )\n\n        , React.createElement(H3, null, \"Accuracy: a reward that makes \\\"I don't know\\\" worth saying\"         )\n        , React.createElement(P, null, \"The knowledge calibration environment trains the model to answer a factual question when it knows the answer and to abstain when it does not. The report draws the line between two measures: accuracy asks whether an answer is correct, calibration also asks whether the model should have answered at all. Training on accuracy alone rewards guessing.\"\n\n\n\n        )\n        , React.createElement(P, null, \"The questions are closed-book and short-answer, generated from documents in the pretraining web corpus so that only the model's \"\n\n            , React.createElement(Term, { def: \"What a model can recall from its weights alone, with no document or search tool to consult.\"                ,}, \"parametric knowledge\" ), \" can answer them. Filters remove questions that are time-sensitive, ambiguous, built on a false premise, or not answerable from the source document. One example from the report: \\\"In what year did photographer Herman Leonard open his own studio in Greenwich Village?\\\" (1948).\"\n\n\n\n        )\n        , React.createElement(P, null, \"A strict judge compares the final answer with a gold answer that was verified by search offline, and returns one of three outcomes.\"\n\n\n        )\n        , React.createElement(Eq, { label: \"Three-level calibration reward\"  , note: \"From the report. p is the probability that the model's answer would be judged correct.\"              ,}\n          , React.createElement(V, null, \"r\"), \" = 1.0 if correct,   0.5 if it abstains,   0.0 if wrong   ⇒   answering pays only when \"                   , React.createElement(V, null, \"p\"), \" > 0.5\"\n        )\n        , React.createElement(P, null, \"Answering earns \"\n            , React.createElement(V, null, \"p\"), \" on average and abstaining always earns 0.5, so the reward itself places the boundary at 50% confidence. The demo compares this with an accuracy-only reward.\"\n\n        )\n        , React.createElement(AbstainDemo, null )\n        , React.createElement(P, null, \"The reward is only half of the design. In GRPO a task teaches something only if its rollouts receive different rewards. A question teaches abstaining when its rollouts contain both abstentions and wrong answers, and teaches answering when correct answers appear next to abstentions.\"\n\n\n\n        )\n        , React.createElement(P, null, \"So candidate questions are screened with the current policy before training. Each one is sampled 16 times and scored with the RL judge. Questions whose 16 rewards are identical are dropped. The rest are binned into five bands by mean reward and drawn equally from each band, with at least one abstention required in the low-reward bands.\"\n\n\n\n        )\n        , React.createElement(SelectDemo, null )\n        , React.createElement(P, null, \"This screening is what lets calibration stay useful at about 3% of the RL mixture. It keeps both sides of the knowledge boundary represented and keeps groups away from the all-same rewards at which the trainer discards them. Each task also carries one of ten developer messages asking for a short answer.\"\n\n\n\n        )\n\n        , React.createElement(H3, null, \"Instruction following: a gate against each shortcut\"      )\n        , React.createElement(P, null, \"The model is already instruction-tuned. These environments target the harder cases: constraints that sit at different levels of the instruction hierarchy (the developer message set by the application builder versus the user message) and constraints that must be remembered across a conversation. There are three environments.\"\n\n\n\n        )\n        , React.createElement(Steps, { items: [\n          { title: \"Single-turn constraints, double-gated\",\n            body: \"An adapted AutoIF pipeline generates pairs of a natural-language constraint and a Python function that checks it. Constraints cover length, output format, required or forbidden words, per-sentence or per-section templates, capitalization and punctuation, and ordering or repetition. Each is attached to a real user request from filtered WildChat prompts, in the developer message for 70% of tasks and in the user message for 30%. The reward is 1 only if the Python verifier passes and a judge agrees that the response genuinely addressed the request.\" },\n          { title: \"Many constraints at once, all-or-nothing\",\n            body: \"Vendor-written prompts for writing, editing, planning, summarization, extraction and classification, each with about 21.8 rubrics on average that code cannot check. A judge evaluates every rubric and the reward is 1 only if all required rubrics pass.\" },\n          { title: \"Multi-turn constraints, all-or-nothing\",\n            body: \"Conversation templates specify when a simulated user introduces, activates or revises an instruction. Four behaviors are targeted: keeping a standing instruction across turns, applying a conditional instruction only when its condition holds, combining a conversation-wide constraint with a one-turn requirement, and replacing an earlier instruction. The policy receives a stored history and writes the final assistant turn. A judge sees the constraints active on that turn and gives 1 only if every one is satisfied.\" },\n        ],} )\n        , React.createElement(P, null, \"The double gate exists because of an observed failure. With the verifier alone, the report says, the model learned to circumvent the underlying task: a reply can satisfy \\\"under 50 words, no commas\\\" without answering the question.\"\n\n\n        )\n        , React.createElement(P, null, \"The all-or-nothing rule is a choice among three options the team tried. The demo shows why the obvious alternative, averaging the rubric scores, hides most failures.\"\n\n\n        )\n        , React.createElement(AllOrNothingDemo, null )\n\n        , React.createElement(H3, null, \"Faithfulness to context: a judge, then a SQL engine\"        )\n        , React.createElement(P, null, \"Faithfulness means every claim in a response is supported by the context the model was given. Two environments train it, with a focus on contexts longer than 32K tokens.\"\n\n\n        )\n        , React.createElement(P, null, \"The first, grounded queries, pairs a document (a GoodWiki Wikipedia article or a web document from the midtraining corpus) with one request that needs a long answer, drawn from nine request types such as summarization, fact-finding and listing pros and cons. For longer inputs, 2 to 40 documents on the same topic are packed into one context and the questions require combining them. Half are navigation queries, whose answer is scattered over several documents. Half are multi-hop queries with 4 to 7 chained retrieval or computation steps and an explicit output format.\"\n\n\n\n\n\n        )\n        , React.createElement(P, null, \"All of these share one reward adapted from the FACTS Grounding rubric, made of two judges. An instruction-following judge checks that the response addresses every part of the request, calibrated against a reference answer. A claim-level faithfulness judge checks that every claim is supported by the context.\"\n\n\n\n        )\n        , React.createElement(P, null, \"Judges have a weakness here: they become less reliable as the context grows, which is exactly where the training is aimed. The second environment removes the judge by building tasks backwards from structured data, so that a SQL engine knows the answer and which facts it depends on. The six steps below follow the report's figure 27.\"\n\n\n\n        )\n        , React.createElement(Panel, { title: \"How one SQL-grounded task is produced\"     , caption: \"A model writes the question and the SQL; code computes the answer and runs the checks. A failed check sends the item back to be repaired, reworded or replanned.\"                            ,}\n          , React.createElement(Steps, { items: sqlSteps,} )\n        )\n        , React.createElement(P, null, \"The construction works because SQL operations line up with the skills a long-context question demands, as the next table shows. Choosing the shape of the SQL program chooses the difficulty of the reading task.\"\n\n\n        )\n        , React.createElement(Table, { wrapText: true, rowLines: true,}\n          , React.createElement(TableHeader, null, React.createElement(TableRow, null, React.createElement(TableHead, null, \"In the SQL program\"   ), React.createElement(TableHead, null, \"What the model must do in the documents\"       )))\n          , React.createElement(TableBody, null\n            , sqlSkills.map((r) => React.createElement(TableRow, { key: r.sql,}, React.createElement(TableCell, null, r.sql), React.createElement(TableCell, { className: \"font-medium\",}, r.skill)))\n          )\n        )\n\n        , React.createElement(H3, null, \"Helpfulness: learning from a reward model without being fooled by it\"          )\n        , React.createElement(P, null, \"Helpfulness in open conversation has no gold answer. The report treats human judgment as the ground truth and uses RLAIF, \"\n\n           , React.createElement(Term, { def: \"Reinforcement learning from AI feedback: the reward comes from a model trained or prompted to predict human preference. RLHF is the same idea with the reward model fitted to human feedback.\"                              ,}, \"reinforcement learning from AI feedback\"    ), \", to scale it. People cannot grade every rollout, so they grade a sample and two automated graders are calibrated to agree with them.\"\n\n\n        )\n        , React.createElement(Panel, { title: \"The human-calibration loop\"  , caption: \"Human labels do two jobs: they define the target that both automated graders imitate, and fresh labels on the newest checkpoint's outputs are the only reliable way to notice when the policy has started to please the graders in ways people do not prefer (Goodhart's law).\"                                             ,}\n          , React.createElement(Diagram, { direction: \"LR\",\n            nodes: [\n              { id: \"h\", title: \"Human labels\", sub: \"every two weeks\" },\n              { id: \"j\", title: \"Proxy preference judge\", sub: \"offline arena, Elo\" },\n              { id: \"r\", title: \"Generative reward model\", sub: \"reward inside RL\" },\n              { id: \"p\", title: \"New checkpoints\", sub: \"responses to label\" },\n            ],\n            edges: [\n              { from: \"h\", to: \"j\", label: \"calibrate\" }, { from: \"h\", to: \"r\", label: \"calibrate\" },\n              { from: \"r\", to: \"p\", label: \"trains\" }, { from: \"j\", to: \"p\", label: \"ranks\" },\n            ],} )\n          , React.createElement(Small, null, \"The loop closes outside the picture: responses from the new checkpoints go back to the annotators for the next batch of labels.\"                     )\n        )\n        , React.createElement(P, null, \"The human side is specific. Every two weeks, on 200 to 300 prompts, annotators rate responses from the latest checkpoints and from comparable external models. They score each response from 1 to 5 on the attributes below and state a pairwise preference against an anchor response. Five annotators label each pair, and the label used is the mean of the three who agree most.\"\n\n\n\n\n        )\n        , React.createElement(Table, { wrapText: true, rowLines: true,}\n          , React.createElement(TableHeader, null, React.createElement(TableRow, null, React.createElement(TableHead, null, \"Attribute\"), React.createElement(TableHead, null, \"What the annotator, and later the reward model, asks\"        )))\n          , React.createElement(TableBody, null\n            , attributes.map(([k, v]) => React.createElement(TableRow, { key: k,}, React.createElement(TableCell, { className: \"whitespace-nowrap font-medium\" ,}, k), React.createElement(TableCell, null, v)))\n          )\n        )\n        , React.createElement(Small, null, \"The nine attributes of conversational quality, shortened from the report's table 9. Safety, constraint following and proactivity are marked not applicable when a prompt does not call for them.\"                            )\n        , React.createElement(P, null, \"The first grader, the proxy preference judge, is used only for evaluation. It decides pairwise battles between a candidate model and six anchor models, from weak to strong, on 455 open-ended prompts. A \"\n\n\n           , React.createElement(Term, { def: \"A statistical model that assigns each player one strength number such that the chance one beats another depends only on the difference of their strengths. Elo ratings are a rescaled version of those strengths.\"                                 ,}, \"Bradley-Terry\"), \" fit turns the battles into Elo scores, with GLM 5.2 fixed at 1,000. Its prompt was tuned by an automated sweep over variants until its agreement with human labels exceeded the agreement between human raters.\"\n\n\n        )\n        , React.createElement(P, null, \"The second grader, the generative reward model, supplies the RL reward. The tasks are public open-ended prompts (general-knowledge and advice questions) cut to the first user turn. Each has one fixed anchor response, and the reward model says how the policy's answer compares with it. The sketch shows how the pieces combine; the list after it explains each choice.\"\n\n\n\n\n        )\n        , React.createElement(CodeBlock, { code: rlaifCode,} )\n        , React.createElement(Findings, { items: [\n          React.createElement('span', null, React.createElement('b', null, \"Pairwise against an anchor.\"   ), \" The verdict has five levels, from strongly disfavored to strongly favored, mapped to 0 to 1. The anchor sets the difficulty: anchors that were too easy started training already saturated, and anchors from mid-sized models were saturated by the end. Candidate anchors came from several models, and for each prompt the first one in a fixed priority order that passed claim-level factuality and temporal checks was kept. The 2.6% of prompts with no accurate and current candidate were dropped.\"                                                                               ),\n          React.createElement('span', null, React.createElement('b', null, \"Fixed order per prompt.\"   ), \" Graders tend to favor whichever response they read first or second. Whether the policy's answer or the anchor is shown first is fixed for each prompt, so every rollout in a group gets the same bias and it cancels when advantages are computed within the group.\"                                              ),\n          React.createElement('span', null, React.createElement('b', null, \"Two penalty factors.\"  ), \" One grader flags unnecessary content, such as follow-up questions and self-validation. The other flags withheld content, such as clarifying instead of answering and unwarranted refusal. Each flag is weighted by its measured precision against human labels, and both factors multiply the preference reward.\"                                           ),\n          React.createElement('span', null, React.createElement('b', null, \"Length penalty.\" ), \" The reward model prefers longer responses, so a penalty linear in the length of the final answer is subtracted, alongside the cost on reasoning effort that \"                           , React.createElement(LessonLink, { to: \"rl\",} ), \" describes.\" ),\n        ],} )\n\n        , React.createElement(H3, null, \"The invariants: safety and identity\"    )\n        , React.createElement(P, null, \"Safety RL differs from the other environments in one structural way. Each of them covers a single kind of task; the safety environment is deliberately mixed. It spans single-turn requests, multi-turn conversations,\"\n\n\n          , \" \", React.createElement(Term, { def: \"A prompt written to trick a model into complying with a request it should refuse, for example by encoding the request or hiding it among benign questions.\"                          ,}, \"jailbreaks\"), \" and agentic tool-use tasks, across every harm category in Reflection's policy, with harmless, gray-area and harmful prompts.\"\n\n        )\n        , React.createElement(Panel, { title: \"Safety RL tasks by category (share of training tasks)\"        , caption: \"From the report's figure 49. Agentic tasks cover multi-turn prompt injection, where text returned by a tool tries to give the model orders, and dangerous tool calls.\"                          ,}\n          , React.createElement(SegmentedBar, { separated: true, legend: \"inline\", total: 100,\n            segments: safetyMix.map((s) => ({ label: s.label, value: s.value, color: s.color, valueLabel: s.value + \"%\" })),} )\n        )\n        , React.createElement(P, null, \"The scoring rule is symmetric, which is what makes it a reward for judgment and not for refusal. Answering a harmless request passes. Refusing or pivoting away from a harmful one passes. The two opposite cases fail.\"\n\n\n        )\n        , React.createElement(Table, { wrapText: true, rowLines: true,}\n          , React.createElement(TableHeader, null, React.createElement(TableRow, null, React.createElement(TableHead, null, \"Request\"), React.createElement(TableHead, null, \"Passes if the model\"   ), React.createElement(TableHead, null, \"Fails if the model\"   )))\n          , React.createElement(TableBody, null\n            , React.createElement(TableRow, null, React.createElement(TableCell, { className: \"font-medium\",}, \"Harmless\"), React.createElement(TableCell, null, \"Answered\"), React.createElement(TableCell, null, \"Refused or pivoted (over-refusal)\"   ))\n            , React.createElement(TableRow, null, React.createElement(TableCell, { className: \"font-medium\",}, \"Harmful\"), React.createElement(TableCell, null, \"Refused or pivoted\"  ), React.createElement(TableCell, null, \"Answered (harmful compliance)\"  ))\n          )\n        )\n        , React.createElement(P, null, \"Three more settings complete the environment. Harmless and harmful tasks are mixed 1 to 5. Tasks the SFT checkpoint already handles reliably are dropped, so the budget goes to cases that are still open. The environment holds a fixed 5% of the alignment teacher's RL mixture.\"\n\n\n\n        )\n        , React.createElement(P, null, \"The judge is called context-aware because what it is shown depends on the task type. A reply that looks harmless on its own can be the last step of a harmful conversation, and the judge can only see that if it is given the history.\"\n\n\n        )\n        , React.createElement(Table, { wrapText: true, rowLines: true,}\n          , React.createElement(TableHeader, null, React.createElement(TableRow, null, React.createElement(TableHead, null, \"Task type\" ), React.createElement(TableHead, null, \"What the judge is given\"    ), React.createElement(TableHead, null, \"Where the tasks come from\"    )))\n          , React.createElement(TableBody, null\n            , safetyJudge.map((r) => React.createElement(TableRow, { key: r.k,}, React.createElement(TableCell, { className: \"whitespace-nowrap font-medium\" ,}, r.k), React.createElement(TableCell, null, r.sees), React.createElement(TableCell, null, r.src)))\n          )\n        )\n        , React.createElement(P, null, \"The second invariant is identity. The report's reasoning is that pretraining teaches a model many personas and post-training selects the \\\"AI assistant\\\" one, and that drifting away from this persona has been observed to predict misaligned behavior. An RL environment therefore reinforces the default persona: Beam, a helpful AI assistant trained by Reflection. Its tasks mix realistic questions about who the model .createElement(P, null, \"With κη fitted on a single run, the reward equation was used to predict how much each reward component would gain in 318 post-training runs. The comparison is against the simpler predictor it extends, the pass@k ceiling.\"\n\n\n        )\n        , React.createElement(Panel, { title: \"Correlation between predicted and realized reward gain (Pearson r, 318 runs)\"          , caption: \"The pass@k ceiling says how much room an environment has. The replicator forecast adds how fast the recipe will use that room.\"                     ,}\n          , React.createElement(BarList, { max: 1, data: [\n            { label: \"Replicator forecast from step 0\", value: 0.79, valueLabel: \"r = 0.79\" },\n            { label: \"pass@k ceiling alone\", value: 0.46, valueLabel: \"r = 0.46\" },\n          ],} )\n        )\n        , React.createElement(P, null, \"The behavior equation was put to a sharper test. Using the same κη and only step-0 measurements, it predicted whether a given misbehavior would be amplified or squashed under different reward functions. The team used those predictions to design filters and reward changes that removed two habits: template-heavy scaffolding and unnecessary markdown formatting. Figure 25 of the report plots both habits under the problematic reward and under the fixed one. In each case the observed points follow the forecast band: the habit stays common or grows under the first reward, and is squashed or stays rare under the second. The report prints no values for those curves, so they are not redrawn here.\"\n\n\n\n\n\n\n        )\n        , React.createElement(Surprise, { title: \"SFT fixes which behaviors exist, not how common they end up\"          ,}, \"Industry reports cited in the report found that most safety- and alignment-relevant behaviors are already in place at the SFT checkpoint, which suggests reading the final model off that checkpoint. The team found the checkpoint is predictive, but that prevalence can change dramatically through RL. Prevalence had to be combined with selective advantage to get an accurate forecast.\"\n\n\n\n\n        )\n\n        , React.createElement(H3, null, \"Calibration changed when the model answers, not what it knows\"         )\n        , React.createElement(P, null, \"The panel shows how the policy answered its calibration training questions at the start of RL and late in RL. Sampled rollouts were regraded offline on five levels, although training used the three-level reward. Compare the red and green ends of the two bars.\"\n\n\n\n        )\n        , React.createElement(Panel, { title: \"How the model answers its calibration training questions (% of rollouts)\"          ,\n          caption: \"From the report's figure 26, top left. Confident errors fall from 41% to 13% and declined answers rise from 16% to 36%, while confident correct answers barely move, from 39% to 38%.\"                               ,}\n          , calib.map((c) => (\n            React.createElement('div', { key: c.when, className: \"flex flex-col gap-1\"  ,}\n              , React.createElement(Text, { size: 12, weight: \"medium\",}, c.when)\n              , React.createElement(SegmentedBar, { separated: true, legend: \"inline\", total: c.cc + c.hc + c.dec + c.hw + c.cw,\n                segments: [\"cc\", \"hc\", \"dec\", \"hw\", \"cw\"].map((k) => ({ label: calibCfg[k].label, value: c[k], color: calibCfg[k].color, valueLabel: c[k] + \"%\" })),} )\n            )\n          ))\n        )\n        , React.createElement(P, null, \"Those are training questions. The report also measures held-out questions and an external benchmark. In the table, hallucination share is wrong answers divided by all non-correct answers: of the questions the model did not get right, the fraction where it gave a wrong answer when it could have declined.\"\n\n\n        )\n        , React.createElement(Table, { wrapText: true, rowLines: true,}\n          , React.createElement(TableHeader, null, React.createElement(TableRow, null, React.createElement(TableHead, null, \"Question set\" ), React.createElement(TableHead, null, \"Measure\"), React.createElement(TableHead, null, \"Start to late in RL\"    )))\n          , React.createElement(TableBody, null\n            , calibHeldOut.map((r, i) => (\n              React.createElement(TableRow, { key: i,}\n                , React.createElement(TableCell, null, i % 2 === 0 ? r.set : \"\")\n                , React.createElement(TableCell, { className: \"font-medium\",}, r.m)\n                , React.createElement(TableCell, null, React.createElement(Shift, { a: r.a, b: r.b,} ))\n              )\n            ))\n          )\n        )\n        , React.createElement(Small, null, \"From figure 26. The last pair groups 117 held-out questions by how often the pre-RL checkpoint answered them correctly in 16 samples.\"                     )\n        , React.createElement(P, null, \"The pattern is the same in all three sets: wrong answers fall sharply and correct answers move little. On the external AA-Omniscience set accuracy is flat, 31% to 32%, while the hallucination share drops from 53% to 33%. The report's summary is that calibration RL teaches no new facts and leads to fewer wrong answers, not more right ones.\"\n\n\n\n        )\n        , React.createElement(P, null, \"There is a cost on the in-house sets. Held-out accuracy falls from 42% to 36%, and accuracy on questions the model knew before RL falls from 80% to 73%; the report describes the latter as approximately stable. It frames the whole result as movement along a frontier: too little abstention produces confident errors, too much produces a safe but unhelpful model.\"\n\n\n\n        )\n        , React.createElement(Surprise, { title: \"Thinking longer made the model commit to more wrong answers, and calibration RL mostly fixed it\"               ,}, \"One would expect more reasoning to make a model more careful. Reasoning effort is the setting that tells the model how much to think before it answers. Before RL, 41% of the test questions the model abstained on at low effort became wrong answers at high effort: extra thinking talked it into an answer. After calibration RL that share was 12%.\"\n\n\n\n\n        )\n        , React.createElement(P, null, \"The reward itself had to be changed once. An earlier version had five levels: confident correct, hedged correct, abstain, hedged incorrect, incorrect. The judge had to infer confidence from wording, and the policy learned to exploit that. The final version has three levels, and the judge prompt penalizes multiple answers and empty answers and scores a hedged commitment as an abstention. The report adds a second reason for that last choice: other environments need the model to offer a hedged answer, so hedging should not be taught as an error.\"\n\n\n\n\n\n        )\n\n        , React.createElement(H3, null, \"Instruction following and long context\"    )\n        , React.createElement(Findings, { items: [\n          \"Over the course of RL, the instruction-following environments together produced a gain of 24.7% on the held-out IFBench evaluation. The report does not say whether this is a relative change or percentage points.\",\n          \"For prompts with many rubrics, the all-or-nothing reward gave better full-task success than averaging rubric scores and better than partial credit combined with an all-or-nothing term.\",\n          \"After RL that included the two faithfulness environments, Beam scored 67% on LongBench-v2, a long-context benchmark, against a human-expert reference of 50.1%. It exceeded every reported or reproduced model of comparable or smaller size, and two larger ones, Qwen3.8 Max and Inkling.\",\n        ],} )\n\n        , React.createElement(H3, null, \"Helpfulness: three recipe revisions\"   )\n        , React.createElement(P, null, \"The helpfulness recipe went through three revisions, and the report's figure 29 tracks held-out arena Elo for each. The failures of the first two are the main lesson.\"\n\n\n        )\n        , React.createElement(Table, { wrapText: true, rowLines: true,}\n          , React.createElement(TableHeader, null, React.createElement(TableRow, null, React.createElement(TableHead, null, \"Recipe\"), React.createElement(TableHead, null, \"What changed\" ), React.createElement(TableHead, null, \"Held-out arena Elo during RL\"    )))\n          , React.createElement(TableBody, null\n            , React.createElement(TableRow, null, React.createElement(TableCell, { className: \"font-medium\",}, \"Revision 1\" ), React.createElement(TableCell, null, \"First RLAIF recipe\"  ), React.createElement(TableCell, null, \"Peaked early, then collapsed as the policy exploited its reward model\"          ))\n            , React.createElement(TableRow, null, React.createElement(TableCell, { className: \"font-medium\",}, \"Revision 2\" ), React.createElement(TableCell, null, \"Stronger judges and anchor responses\"    ), React.createElement(TableCell, null, \"Plateaued early\" ))\n            , React.createElement(TableRow, null, React.createElement(TableCell, { className: \"font-medium\",}, \"Revision 3 (final)\"  ), React.createElement(TableCell, null, \"Reward hacks fixed\"  ), React.createElement(TableCell, null, \"Rose throughout training and finished above all earlier runs\"        ))\n          )\n        )\n        , React.createElement(Findings, { items: [\n          \"The resulting Beam model reaches an arena Elo of about 1,044 (GLM 5.2 = 1,000), on the Pareto frontier of Elo against total parameter count among open-weight models.\",\n          \"The arena is an automated judge, so it was checked against people: it predicted a 56.5% win rate for Beam over GLM 5.2, and human raters measured 56.3%.\",\n          \"Two other reward shapes were tried and rejected. Pointwise scores, where the reward model rates one answer on its own, squeezed each group into about a quarter of the reward range. Preference logits saturated, giving near-maximal reward for marginal or no differences in quality.\",\n          \"A factor analysis of the per-attribute human ratings found one dominant quality factor that correlated r = 0.95 with overall preference. That is what a Bradley-Terry fit assumes, so a single Elo number is a fair summary.\",\n          \"Successive SFT iterations, including a self-distillation cold start, raised the step-0 arena Elo by about 100 points, roughly from a 24% to a 37% implied win rate against the Elo anchor model.\",\n        ],} )\n        , React.createElement(Surprise, { title: \"Same starting score, much faster learning\"     ,}, \"Rewriting the SFT reasoning traces for multi-turn chat to be more concise and less templated did not change the step-0 Elo. A checkpoint that scores the same would be expected to train the same. Under an identical RL recipe the rewritten checkpoint improved its arena score much faster. The report says the SFT checkpoint sets both where RL starts and how fast it moves, and gives no further explanation.\"\n\n\n\n\n        )\n        , React.createElement(Surprise, { title: \"Training on tool-use tasks leaked clarifying questions into ordinary chat\"         ,}, \"Some of the user-collaboration tasks require the agent to ask a simulated user for missing details. After training on them the model began asking unnecessary follow-ups and clarifications in other conversational tasks, a behavior learned in one environment appearing in another. The two penalty factors on the helpfulness reward (unnecessary content, withheld content) were added in response and reduced it.\"\n\n\n\n\n        )\n        , React.createElement(Surprise, { title: \"What people reward moved as the model improved\"       ,}, \"The target of this training is not fixed. When annotators compared early, weaker checkpoints, coverage carried the largest weight in their preference. For later, stronger checkpoints its weight diminished in favor o hat need them.\",\n    \"A policy update never restarts a rollout. A running turn keeps its KV cache and continues under the new weights; at the next turn the whole context is recomputed under those weights, replaying the expert selections recorded earlier.\",\n    \"Admission limits and bounded buffers trade trainer supply against policy staleness. They slow admission when training slows, but they do not put a hard bound on how old a token can be.\",\n    \"Every generated token carries its policy version into training. Those records showed that the largest source of staleness was rollouts of the same group finishing at different times, ahead of queueing before training.\",\n    \"The obvious dashboards were not enough: memory ran out inside the sequence-length limit when tokens piled onto a few MoE experts, and cache-hit rates above 94% still left more fresh input tokens than generated tokens through much of the run.\",\n  ],\n};\n\n// ---------- Part 1: architecture (report figure 32) ----------\nconst services = {\n  ctl: {\n    title: \"Control service\", sub: \"coordinates the job\",\n    does: \"Manages the job lifecycle and runs three activities concurrently: rollout generation, batch assembly and policy updates. It decides how many rollouts are admitted, and it coordinates when a new policy version is published and adopted.\",\n    moves: \"Only metadata and references pass through it. Trainer nodes fetch their own batch data, and serving instances pull weights themselves.\",\n    fails: \"A control failure restarts the whole job from the last completed checkpoint.\",\n  },\n  roll: {\n    title: \"Rollout workers\", sub: \"run agent and environment\",\n    does: \"Each worker drives one agent-environment interaction: it asks policy inference for the next model response, sends tool calls to a sandbox, and evaluates the task outcome at the end.\",\n    moves: \"Completed rollout data goes to the training service; execution records go to storage.\",\n    fails: \"An isolated worker failure is recovered locally, without restarting the job.\",\n  },\n  inf: {\n    title: \"Policy inference\", sub: \"generates model responses\",\n    does: \"Built on SGLang, an open-source serving engine. Each serving instance spreads one copy of the model over several GPUs: attention and the KV cache of a request live on one GPU (a rank), while the expert layers are shared across the instance.\",\n    moves: \"Receives inference requests from rollout workers and updated weights from the trainer. Different instances can be serving different policy versions at the same moment.\",\n    fails: \"A failed serving pod is replaced on a healthy node and unhealthy routing targets are excluded. The job keeps running.\",\n  },\n  sbx: {\n    title: \"Sandbox service\", sub: \"executes tools\",\n    does: \"Runs the commands the agent issues, in a sandbox created from a task-specific OCI (Open Container Initiative) container image. A sandbox keeps its own files and processes across the turns of a rollout.\",\n    moves: \"Returns tool results and structured failure details to the rollout worker. The rollout environment, not the sandbox, defines task behavior and reward.\",\n    fails: \"The sandbox fleet scaled independently of training and inference. The report groups it with the shared services outside the core RL stack.\",\n  },\n  judge: {\n    title: \"Judge service\", sub: \"vetoes false passes\",\n    does: \"A separately served, fixed judge model reviews rollouts that already passed the automated task checks, against versioned assessment criteria. It can veto a pass before the reward reaches training.\",\n    moves: \"Receives review requests and returns assessments. It never receives policy weight updates, and its endpoint scales on its own.\",\n    fails: \"Under the fail-closed configuration, a judge request that still fails after retries fails the rollout, so an unreviewed pass cannot become a positive reward.\",\n  },\n  train: {\n    ti
