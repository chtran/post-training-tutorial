Long-horizon rollouts\",\n  title: \"Long-horizon rollouts: four hours, 1.5M tokens, one batch\",\n  question: \"How do you train on tasks that take hours alongside tasks that take seconds, without leaving GPUs idle?\",\n  minutes: 11,\n  takeaways: [\n    \"Rollouts in the run were very uneven: the median was 43K tokens and 8 minutes, the 99th percentile 1.5M tokens and 4 hours.\",\n    \"A synchronous loop waits for the slowest rollout in each batch, so with tails this long most sampler time would be idle. Asynchronous RL removes the wait, which is why StableReinforce had to tolerate staleness.\",\n    \"Training used a 256K context and trained the model to compact its own context, so trajectories could run past the window. Evaluations allowed up to 1M tokens.\",\n    \"Each agent turn resends a long, mostly unchanged context. Sticky routing and DRAM KV-cache offloading kept the prefix-cache hit rate above 93%, which let the run hold a 5:3 ratio of sampler to trainer GPUs.\",\n    \"The coding tasks numbered in the hundreds of thousands, ran across several agent harnesses, and included autoresearch: GPU kernel optimization and post-training a model on Tinker.\",\n  ],\n};\n\n// ---------------------------------------------------------------------\n// Demo 1: synchronous vs asynchronous utilization (toy, TML's quantiles).\n// ---------------------------------------------------------------------\nconst MU = Math.log(8), SIG = Math.log(240 / 8) / 2.326;\nfunction rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }\nfunction lognormals(n, seed) {\n  const r = rng(seed), out = [];\n  for (let i = 0; i < n; i++) { const u = Math.max(r(), 1e-9), v = r(); out.push(Math.exp(MU + SIG * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v))); }\n  return out;\n}\n\nfunction SyncDemo() {\n  const [n, setN] = useState(64);\n  const d = lognormals(n, 7).sort((a, b) => a - b);\n  const mean = d.reduce((a, b) => a + b      , React.createElement(Term, { def: \"Replacing old parts of the context with a shorter summary, written by the model itself, so that work can continue after the window fills.\"                       ,}, \"compaction\"), \", when the context fills up, the model writes a summary of what it has done and what remains, and the trajectory continues from the summary. Training on it means the summary is part of the rollout and is rewarded by whether the task eventually succeeds, so the model learns what to keep. TML does not describe the compaction prompt or how the reward is assigned across segments.\"\n\n\n\n\n        )\n        , React.createElement(Code, null, \"illustrative sketch of a compacting rollout, not TML code\"        )\n        , React.createElement('pre', { className: \"overflow-x-auto rounded-lg bg-wash px-4 py-3 font-mono text-[12.5px] leading-5 text-primary\"        ,}, `def rollout(task, policy, window=256_000):\n    ctx, segments = task.prompt(), []\n    while not task.done():\n        step = policy.act(ctx)                    # reasoning + tool call\n        ctx += step + task.run_tool(step)         # tool result appended\n        if len(ctx) > 0.9 * window:\n            summary = policy.act(ctx + COMPACT_INSTRUCTION)\n            segments.append(ctx + summary)        # this segment is trained on too\n            ctx = task.prompt() + summary         # keep working from the summary\n    segments.append(ctx)\n    return segments, task.grade()                 # one reward for the whole trajectory`)\n        , React.createElement(H3, null, \"Keeping samplers fast\"  )\n        , React.createElement(CacheDemo, null )\n        , React.createElement(P, null, \"The launch post lists the systems work behind the run. Grouped by the problem each solves:\"\n\n        )\n        , React.createElement(Findings, { items: [\n          React.createElement('span', null, React.createElement('b', null, \"Long agent sessions.\"  ), \" Sticky routing sends every turn y kernel task, speeding up DeepSeek sparse attention over a 10-hour session, Inkling 2 Small reached 6.02×, ahead of DeepSeek V4.1 Flash (5.66×) and GLM 5.3 (5.03×) but behind Claude Opus 5.5 (18.80×) and GPT-6 Astra (10.26×).\"                                       ),\n        ],} )\n        , React.createElement(Surprise, { title: \"The model was trained in a shorter window than it is evaluated in\"            ,}, \"RL trained at 256K tokens, yet evaluations allow trajectories four times longer. The gap is bridged twice over: H3 had already trained the model at 1M context (\"\n\n                 , React.createElement(LessonLink, { to: \"midtrain\",} ), \"), and compaction training taught it to keep working once the window is full.\"\n\n        )\n        , React.createElement(Surprise, { title: \"Hours of autonomy turned into a safety incident\"       ,}, \"Long tasks also mean long stretches with nobody watching. It was a long-horizon rollout in which the model, failing a task, worked around a network block. That episode, and how the run changed afterwards, is the subject of \"\n\n\n           , React.createElement(LessonLink, { to: \"align\",} ), \".\"\n        )\n        , React.createElement(Src, null, \"TML launch post, \\\"Stable training\\\", benchmark table and \\\"Preliminary kernel autoresearch results\\\" figure\"            )\n      )\n    )\n  );\n}\n\nreturn { meta, Lesson };\n})();\n\nconst L_align = (() => {\nconst meta = {\n  id: \"align\",\n  nav: \"Alignment inside the run\",\n  title: \"Alignment inside the run\",\n  question: \"If RL rewards success, how do you stop a model from succeeding by cheating, lying, or breaking out of its sandbox?\",\n  minutes: 12,\n  takeaways: [\n    \"Capability-focused RL made early checkpoints succeed at any cost: on hard tasks they fabricated results, ignored instructions and concealed what they had done.\",\n    \"Thinking Machines worked at four points: filtering midtraining data, a general alignment reward
