2 py-[1px] font-mono text-[11px] font-normal leading-5 text-secondary"></span></button></div></div><div class="flex flex-col items-center py-1 text-secondary"><svg width="14" height="26" viewBox="0 0 14 26" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 1v23M2 19l5 5 5-5"></path></svg><span class="pt-1 text-[11.5px] leading-4">the released checkpoint</span></div><div class="flex h-full flex-col gap-1 rounded-lg px-3 pb-3 pt-2 bg-tint-green"><div class="text-[11px] font-semibold uppercase tracking-[0.08em] text-secondary">What it is for</div><div class="pb-1 text-[12px] leading-4 text-secondary">Built to be fine-tuned further by customers on Tinker.</div><button type="button" tabindex="0" class="inline-flex touch-manipulation select-none font-medium max-w-full items-center justify-center overflow-hidden whitespace-nowrap outline-none [-webkit-touch-callout:none] disabled:opacity-50 shrink-0 focus-ring [&amp;&gt;:where(span)]:min-w-0 [&amp;_svg]:pointer-events-none [&amp;_svg]:shrink-0 [&amp;_svg:first-child:not(:last-child)]:mr-[4px] [&amp;_svg:last-child:not(:first-child)]:ml-[2px] bg-bg-elevated-transparent text-text-primary border border-border-primary light:bg-clip-padding can-hover:text-text-primary can-hover:bg-[image:linear-gradient(rgb(var(--tint-tertiary)),rgb(var(--tint-tertiary))),linear-gradient(rgb(var(--bg-elevated-transparent)),rgb(var(--bg-elevated-transparent)))] data-[pressed]:bg-[image:linear-gradient(rgb(var(--tint-tertiary)),rgb(var(--tint-tertiary))),linear-gradient(rgb(var(--bg-elevated-transparent)),rgb(var(--bg-elevated-transparent)))] rounded-[6px] px-[10px] h-[28px] text-13 [&amp;_svg]:size-[16px] !h-auto w-full !items-start !justify-between gap-3 !px-3 !py-2 text-left"><span class="flex min-w-0 flex-col"><span class="text-[13.5px] font-semibold leading-5 text-primary">Customizability and results</span><span class="whitespace-normal text-[12px] font-normal leading-4 text-secondary">How fast it learns a new task, and where it still falls short</span></span><span class="shrink-0 rounded-full bg-wash px-2 py-[1px] font-mono text-[11px] font-normal leading-5 text-secondary"></span></button></div></div><p class="text-[12.5px] leading-5 text-secondary">Each box opens the lesson that explains it; the number is the lesson. Read top to bottom.</p></div></div></div><section class="flex flex-col gap-3"><h3 class="pt-3 text-[16px] font-semibold leading-6 text-primary">What changed from the first Inkling</h3><p class="text-[15px] leading-7 text-primary">The first Inkling was post-trained in pieces: a short supervised warm-up on synthetic data, then separate reasoning and agentic RL runs whose results were merged by distilling several teachers into one student. Inkling 2 Small moves the warm-up into the data itself (the trajectory-heavy H3 and H4 phases) and replaces the separate runs with <b>one joint RL run</b>. That choice is what makes the rest of the recipe necessary: once short chat tasks and four-hour coding tasks share one run, the trainer always has stale samples to learn from, and the infrastructure has to keep very long contexts cheap.</p><p class="text-[15px] leading-7 text-primary">The team also treated <b>customizability</b> as a release goal: the model should improve quickly when customers fine-tune it further. That goal shows up at both ends, in how much pretraining data was used and in how the model was evaluated before release.</p></section><section class="flex flex-col gap-3"><h3 class="pt-3 text-[16px] font-semibold leading-6 text-primary">The lessons</h3><div class="flex flex-col"><div class="flex items-center gap-4 border-t border-primary py-3"><span class="flex h-7 w-7 shrink-0 items-center justify-center rounded-full bg-wash font-mono text-[12px] text-secondary">1</span><div class="flex min-w-0 grow flex-col"><span class="text-[15px] font-semibold leading-6 text-primary">Pretraining data: a broad mix, then newer and better</span><span class="text-[13.5px] leading-5 text-secondary">Why train on fewer tokens than comparable models, and how do you tell whether the data was good?</span></div><span class="hidden shrink-0 text-[12px] text-secondary sm:block">11 min</span><button type="button" tabindex="0" class="inline-flex touch-manipulation select-none font-medium max-w-full items-center justify-center overflow-hidden whitespace-nowrap outline-none [-webkit-touch-callout:none] disabled:opacity-50 shrink-0 focus-ring [&amp;&gt;:where(span)]:min-w-0 [&amp;_svg]:pointer-events-none [&amp;_svg]:shrink-0 [&amp;_svg:first-child:not(:last-child)]:mr-[4px] [&amp;_svg:last-child:not(:first-child)]:ml-[2px] bg-bg-elevated-transparent text-text-primary border border-border-primary light:bg-clip-padding can-hover:text-text-primary can-hover:bg-[image:linear-gradient(rgb(var(--tint-tertiary)),rgb(var(--tint-tertiary))),linear-gradient(rgb(var(--bg-elevated-transparent)),rgb(var(--bg-elevated-transparent)))] data-[pressed]:bg-[image:linear-gradient(rgb(var(--tint-tertiary)),rgb(var(--tint-tertiary))),linear-gradient(rgb(var(--bg-elevated-transparent)),rgb(var(--bg-elevated-transparent)))] rounded-[6px] px-[10px] h-[28px] gap-[4px] text-13 [&amp;_svg]:size-[16px]"><span class="truncate">Open</span></button></div><div class="flex items-center gap-4 border-t border-primary py-3"><span class="flex h-7 w-7 shrink-0 items-center justify-center rounded-full bg-wash font-mono text-[12px] text-secondary">2</span><div class="flex min-w-0 grow flex-col"><span class="text-[15px] font-semibold leading-6 text-primary">Midtraining: learning from other models' work</span><span class="text-[13.5px] leading-5 text-secondary">Before any RL, how do you teach a pretrained model to act like an agent, and what should it never learn to imitate?</span></div><span class="hidden shrink-0 text-[12px] text-secondary sm:block">10 min</span><button type="button" tabindex="0" class="inline-flex touch-manipulation select-none font-medium max-w-full items-center justify-center overflow-hidden whitespace-nowrap outline-none [-webkit-touch-callout:none] disabled:opacity-50 shrink-0 focus-ring [&amp;&gt;:where(span)]:min-w-0 [&amp;_svg]:pointer-events-none [&amp;_svg]:shrink-0 [&amp;_svg:first-child:not(:last-child)]:mr-[4px] [&amp;_svg:last-child:not(:first-child)]:ml-[2px] bg-bg-elevated-transparent text-text-primary border border-border-primary light:bg-clip-padding can-hover:text-text-primary can-hover:bg-[image:linear-gradient(rgb(var(--tint-tertiary)),rgb(var(--tint-tertiary))),linear-gradient(rgb(var(--bg-elevated-transparent)),rgb(var(--bg-elevated-transparent)))] data-[pressed]:bg-[image:linear-gradient(rgb(var(--tint-tertiary)),rgb(var(--tint-tertiary))),linear-gradient(rgb(var(--bg-elevated-transparent)),rgb(var(--bg-elevated-transparent)))] rounded-[6px] px-[10px] h-[28px] gap-[4px] text-13 [&amp;_svg]:size-[16px]"><span class="truncate">Open</span></button></div></div><p class="text-[12.5px] leading-5 text-secondary">Every lesson has three parts: the intuition in plain language, then the math and code, then what the results showed, with results that went against expectation marked "Surprising". Lessons 1 and 2 cover the data, 3 to 6 the RL run, and 7 the released model. Architecture and the 4-bit numerics are left out on purpose, except where they change the data or the RL recipe.</p></section><section class="flex flex-col gap-3"><h3 class="pt-3 text-[16px] font-semibold leading-6 text-primary">Where the facts come from</h3><p class="text-[15px] leading-7 text-primary">Most numbers come from Thinking Machines' launch post and model card. The RL objective is documented in the Tinker docs and in the score-centering paper it builds on (Marek and Ryabinin, Together AI). An expert review by Sunt on Zhihu adds context and comparisons with other labs; anything that comes only from that review is labelled "per the Zhihu review".</p></section><section class="flex flex-col gap-3"><h3 class="pt-3 text-[16px] font-semibold leading-6 text-primary">Words used throughout</h3><dl class="grid grid-cols-[max-content_1fr] gap-x-4 gap-y-1 px-1 text-[13.5px] leading-6"><dt class="font-serif italic text-primary"><span class="not-italic font-sans font-semibold">Token</span></dt><dd class="text-secondary">The unit a language model reads and writes, roughly three-quarters of an English word. Images are also turned into tokens.</dd><dt class="font-serif italic text-primary"><span class="not-italic font-sans font-semibold">Pretraining</span></dt><dd class="text-secondary">Training a model to predict the next token of ordinary documents. It is where almost all knowledge comes from.</dd><dt class="font-serif italic text-primary"><span class="not-italic font-sans font-semibold">Midtraining</span></dt><dd class="text-secondary">Further next-token training on narrower, higher-quality data shaped like the model's final use, before RL starts.</dd><dt class="font-serif italic text-primary"><span class="not-italic font-sans font-semibold">Trajectory</span></dt><dd class="text-secondary">A complete record of a model working on a task: its reasoning, every tool call and every tool result. Called a rollout during RL.</dd><dt class="font-serif italic text-primary"><span class="not-italic font-sans font-semibold">RL</span></dt><dd class="text-secondary">Reinforcement learning: the model attempts tasks, a grader scores the attempts, and high-scoring behavior is made more likely.</dd><dt class="font-serif italic text-primary"><span class="not-italic font-sans font-semibold">Grader</span></dt><dd class="text-secondary">Whatever turns an attempt into a reward: hidden tests, a reference answer, an LLM judge with a rubric, or a reward model.</dd><dt class="font-serif italic text-primary"><span class="not-italic font-sans font-semibold">Sampler / trainer</span></dt><dd class="text-secondary">The two copies of the model in RL. The sampler generates rollouts; the trainer computes gradients on them and updates the weights.</dd><dt class="font-serif italic text-primary"><span class="not-italic font-sans font-semibold">Staleness</span></dt><dd class="text-secondary">How many weight updates the trainer has made since the sampler produced a rollout. Stale data comes from an older policy.</dd><dt class="font-serif italic text-primary"><span class="not-italic font-sans font-semibold">Tinker</span></dt><dd class="text-secondary">Thinking Machines' fine-tuning service. Its public loss functions and cookbook are the same tools used to train Inkling 2 Small.</dd></dl></section></div><div class="flex items-center justify-between gap-3 pt-8"><span></span><button type="button" tabindex="0" class="inline-flex touch-manipulation select-none font-medium max-w-full items-center justify-center overflow-hidden whitespace-nowrap outline-none [-webkit-touch-callout:none] disabled:opacity-50 shrink-0 focus-ring [&amp;&gt;:where(span)]:min-w-0 [&amp;_svg]:pointer-events-none [&amp;_svg]:shrink-0 [&amp;_svg:first-child:not(:last-child)]:mr-[4px] [&amp;_svg:last-child:not(:first-child)]:ml-[2px] bg-bg-accent-neutral border border-border-primary-always-black text-text-primary-inverse can-hover:brightness-[.92] data-[pressed]:brightness-[.85] rounded-[6px] px-[10px] h-[28px] gap-[4px] text-13 [&amp;_svg]:size-[16px]"><span class="truncate">Next: Pretraining data</span></button></div><p class="inline-hidden text-[12px] text-text-secondary">Sources: Thinking Machines Lab, "Introducing Inkling 2 Small" (thinkingmachines.ai/news/inkling-2-small), the Inkling 2 Small model card, "End-to-End 4-Bit Training" (Connectionism blog), the Tinker StableReinforce docs, the vLLM and SGLang day-0 posts, and an expert review by Sunt on Zhihu (zhuanlan.zhihu.com/p/2107214533513289893). Figures are the sources' own and were not independently verified; claims that come only from the review are marked as such. Interactive demos use made-up toy inputs to show a mechanism, and say so.</p></main></div></div></div>
